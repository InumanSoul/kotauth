name: kotauth

services:
  app:
    image: ghcr.io/inumansoul/kotauth:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kotauth
    env_file:
      - path: .env
        required: false
    environment:
      KAUTH_BASE_URL: ${KAUTH_BASE_URL:-http://localhost:8080}
      KAUTH_ENV: ${KAUTH_ENV:-development}
      KAUTH_SECRET_KEY: ${KAUTH_SECRET_KEY:-a]1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4}
      KAUTH_DEMO_MODE: ${KAUTH_DEMO_MODE:-true}
      KAUTH_UPDATE_CHECK: ${KAUTH_UPDATE_CHECK:-false}
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/${DB_NAME:-kotauth_db}}
      DB_USER: ${DB_USER:-kotauth}
      DB_PASSWORD: ${DB_PASSWORD:-localonly}
      KAUTH_REDIS_URL: ${KAUTH_REDIS_URL:-}
    ports:
      - "8080:8080"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: kotauth-db
    environment:
      POSTGRES_DB: ${DB_NAME:-kotauth_db}
      POSTGRES_USER: ${DB_USER:-kotauth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localonly}
    volumes:
      - kotauth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kotauth} -d ${DB_NAME:-kotauth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kotauth-redis
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  kotauth_db_data:
