# Build JVM memory settings.
# The kotlinx.html view DSL produces deeply nested generic code that is
# heavy on the Kotlin compiler — default daemon heap hits GC overhead
# limits as the codebase grows.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx2g

# Daemon reuse and parallel task execution
org.gradle.parallel=true
org.gradle.caching=true
