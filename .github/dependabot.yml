version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      ktor:
        patterns:
          - "io.ktor:*"
      exposed:
        patterns:
          - "org.jetbrains.exposed:*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
