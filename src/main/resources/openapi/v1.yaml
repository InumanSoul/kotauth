openapi: 3.1.0
info:
  title: KotAuth REST API
  version: 1.1.0
  description: |
    Machine-to-machine REST API for managing KotAuth identity platform resources.

    ## Authentication

    All endpoints require an API key passed as a Bearer token:
    ```
    Authorization: Bearer kauth_<tenantSlug>_<key>
    ```

    API keys are created and managed in the KotAuth Admin Console under
    **Settings → API Keys** for each workspace.

    ## Scopes

    Each API key is issued with a set of scopes that control which operations it
    may perform. Attempting a request without the required scope returns `403 Forbidden`.

    | Scope                | Description                                  |
    |----------------------|----------------------------------------------|
    | `users:read`         | List and retrieve users                      |
    | `users:write`        | Create, update, disable users; assign roles  |
    | `roles:read`         | List and retrieve roles                      |
    | `roles:write`        | Create, update, delete roles                 |
    | `groups:read`        | List and retrieve groups                     |
    | `groups:write`       | Create, update, delete groups; manage members|
    | `applications:read`  | List and retrieve applications               |
    | `applications:write` | Update and disable applications              |
    | `sessions:read`      | List active sessions                         |
    | `sessions:write`     | Revoke sessions                              |
    | `audit_logs:read`    | Read audit log events                        |
    | `user_attributes:read`  | Read custom per-user attributes           |
    | `user_attributes:write` | Create, update, delete per-user attributes |
    | `claim_mappers:read`    | List tenant claim mappers                 |
    | `claim_mappers:write`   | Create, update, delete claim mappers      |
    | `identity_providers:read`  | List identity providers (never exposes the client secret) |
    | `identity_providers:write` | Create, update, delete identity providers |
    | `auth:send-otp`         | Trigger an email-OTP challenge for a user |
    | `auth:verify-otp`       | Verify an email-OTP challenge and obtain an authorization code |
    | `workspace:read`        | Read tenant metadata, sign-in methods, and security/MFA policy (no SMTP credentials) |
    | `workspace:write`       | Change workspace settings: sign-up, sign-in methods, password/MFA/lockout policy, token lifetimes, default locale, SMTP |
    | `webhooks:read`         | List webhook endpoints (never exposes the signing secret) |
    | `webhooks:write`        | Create and delete webhook endpoints       |
    | `resource_servers:read`  | List and retrieve resource servers (RFC 8707 resource indicators) |
    | `resource_servers:write` | Create, update, delete resource servers; manage client authorization edges |
    | `api_keys:read`          | List API keys (never exposes the key hash or raw value) |
    | `api_keys:write`         | Create and revoke API keys — meta-circular: a key can revoke itself |

    ## Custom attributes and JWT claims

    You can attach arbitrary key/value string attributes to users and project them
    into issued JWTs via tenant-level **claim mappers**. Changes take effect on the
    next access-token issuance (no live-session mutation).

    > **Security note:** attribute values flow unencrypted into JWTs, which are
    > base64-decodable by anyone in possession of the token. Do not store PII or
    > secrets as user attributes unless the token consumers are fully trusted.

    ## Errors

    All errors follow [RFC 7807 Problem Details](https://www.rfc-editor.org/rfc/rfc7807)
    with `Content-Type: application/problem+json`.

    ```json
    {
      "type": "https://kotauth.dev/errors/422",
      "title": "Validation Error",
      "status": 422,
      "detail": "Username may only contain letters, digits, dots, underscores, hyphens, @, and +."
    }
    ```

    ## Rate limits

    Write requests (`POST`/`PUT`/`PATCH`/`DELETE`) are limited to 60 per 60-second
    window per API key per workspace. Exceeded requests receive `429 Too Many
    Requests` with a `Retry-After` header (see `components.responses.TooManyRequests`).
    Read requests (`GET`) are unrestricted in v1.21.0.

    ## v1.21.0

    Adds workspace read (`GET /workspace`), webhook endpoint management, RFC 8707
    resource servers (with per-client authorization edges), self-service API key
    management, and passkey inspection/revocation, plus extended filtering on the
    users and sessions list endpoints. See `CHANGELOG.md` for the full release notes.

servers:
  - url: "{baseUrl}/t/{tenantSlug}/api/v1"
    description: KotAuth REST API v1
    variables:
      baseUrl:
        default: "http://localhost:8080"
      tenantSlug:
        default: "master"

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: KotAuth API Key (kauth_<slug>_<random>)

  schemas:
    # ---- Common ----
    ApiMeta:
      type: object
      properties:
        total:  { type: integer, description: "Total number of items in result set" }
        offset: { type: integer, description: "Current pagination offset" }
        limit:  { type: integer, description: "Current page size" }

    ProblemDetail:
      type: object
      properties:
        type:   { type: string, format: uri }
        title:  { type: string }
        status: { type: integer }
        detail: { type: string }

    # ---- Users ----
    UserDto:
      type: object
      required: [id, subject, username, email, fullName, emailVerified, enabled, mfaEnabled, requiredActions, isLocked]
      properties:
        id:
          type: integer
          description: Kotauth's own key for the user, used in this API's paths. Not the `sub`.
        subject:
          type: string
          description: |
            The `sub` in this user's tokens, and the key a relying party should store. Users
            created before v1.31.0 keep their row id here; newer ones have a UUID unless the
            creator chose one. It never changes, and it survives an export and import.
        username:        { type: string }
        email:           { type: string, format: email }
        fullName:        { type: string }
        emailVerified:   { type: boolean }
        enabled:         { type: boolean }
        mfaEnabled:      { type: boolean }
        requiredActions:
          type: array
          items:
            type: string
            enum: [SET_PASSWORD, CHANGE_PASSWORD]
          description: |
            Actions the user must complete on next login. Empty for fully
            provisioned accounts. `SET_PASSWORD` = user was invited and has
            not yet chosen a password. `CHANGE_PASSWORD` = admin issued a
            temporary password / forced reset.
        isLocked:
          type: boolean
          description: |
            True if the account currently has an active lockout (usually from
            failed-login threshold or OTP-brute-force protection). This is
            independent of `enabled` — `POST /users/{id}/enable` does not
            clear an active lockout; use the admin console for that.
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 timestamp of user creation. Nullable for legacy rows.

    CreateUserRequest:
      type: object
      required: [email, fullName, password]
      properties:
        username:
          type: string
          pattern: "^[a-zA-Z0-9._@+-]+$"
          maxLength: 255
          description: Generated from the name and email when omitted or blank.
        email:    { type: string, format: email }
        fullName: { type: string }
        password: { type: string, minLength: 4 }
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The user's `sub`, for seeds, fixtures and users migrated from another identity
            provider with their existing `sub`. Omit to have Kotauth assign a random UUID. Must
            be unique in the workspace (409 otherwise), must not start or end with whitespace,
            and can't be changed later.

    UpdateUserRequest:
      type: object
      required: [email, fullName]
      properties:
        email:    { type: string, format: email }
        fullName: { type: string }
        username:
          type: string
          pattern: "^[a-zA-Z0-9._@+-]+$"
          maxLength: 255
          description: Omit to leave the existing username unchanged.

    InviteUserRequest:
      type: object
      required: [email, fullName]
      description: |
        Invite a new user without a password. The user will receive an email
        with a 72-hour invite link and set their own password on first login.
        The tenant must have SMTP configured.
      properties:
        username:
          type: string
          pattern: "^[a-zA-Z0-9._@+-]+$"
          maxLength: 255
          description: Generated from the name and email when omitted or blank.
        email:    { type: string, format: email }
        fullName: { type: string }
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: Same as on `CreateUserRequest`. Omit to have Kotauth assign a random UUID.

    TemporaryPasswordResponse:
      type: object
      required: [changePasswordUrl, expiresAt]
      description: |
        Response for POST /users/{userId}/temporary-password. The raw link is
        returned exactly once. Treat it as a secret and deliver to the user
        over a trusted channel. Expires 24 hours after issuance.
      properties:
        changePasswordUrl:
          type: string
          format: uri
          description: Full `/t/{slug}/change-password?token=…` URL
        expiresAt:
          type: string
          format: date-time

    RevokeSessionsResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          description: Number of active sessions that were revoked (0 if user had none).

    # ---- Roles ----
    RoleDto:
      type: object
      required: [id, name, scope, tenantId]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string, nullable: true }
        scope:       { type: string, enum: [TENANT, CLIENT] }
        tenantId:    { type: integer }

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string, pattern: "^[a-zA-Z0-9._-]+$" }
        description: { type: string }
        scope:       { type: string, enum: [tenant, client], default: tenant }

    UpdateRoleRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string, nullable: true }

    # ---- Groups ----
    GroupDto:
      type: object
      required: [id, name, tenantId]
      properties:
        id:            { type: integer }
        name:          { type: string }
        description:   { type: string, nullable: true }
        parentGroupId: { type: integer, nullable: true }
        tenantId:      { type: integer }

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:          { type: string }
        description:   { type: string }
        parentGroupId: { type: integer, nullable: true }

    UpdateGroupRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string, nullable: true }

    # ---- Applications ----
    GrantType:
      type: string
      enum: [authorization_code, client_credentials, refresh_token]
      description: |
        An OAuth2 grant the application is registered to use. The token endpoint refuses any
        grant the application isn't registered for (`unauthorized_client`).

    ApplicationDto:
      type: object
      required: [id, clientId, name, accessType, enabled, redirectUris, grantTypes]
      properties:
        id:           { type: integer }
        clientId:     { type: string }
        name:         { type: string }
        description:  { type: string, nullable: true }
        accessType:   { type: string, enum: [public, confidential] }
        enabled:      { type: boolean }
        redirectUris: { type: array, items: { type: string, format: uri } }
        grantTypes:
          type: array
          items: { $ref: "#/components/schemas/GrantType" }
        audience:
          type: string
          nullable: true
          description: The `aud` claim in this client's tokens. Null means the client ID is used.
        tokenExpiryOverride:
          type: integer
          nullable: true
          description: Access-token lifetime in seconds for this client. Null means the workspace's applies.

    UpdateApplicationRequest:
      type: object
      properties:
        name:         { type: string }
        description:  { type: string, nullable: true }
        accessType:   { type: string, enum: [public, confidential] }
        redirectUris: { type: array, items: { type: string, format: uri } }
        grantTypes:
          type: array
          items: { $ref: "#/components/schemas/GrantType" }
          description: |
            Omit to leave the application's grants unchanged. Pass an explicit array —
            including `[]` — to replace them. Required to remove `client_credentials` from a
            confidential application, e.g. before demoting it to `public`.
        audience:
          type: string
          description: |
            The default `aud` of this client's access tokens when no `resource` is requested.
            ID tokens are always addressed to the client id. An empty string clears it.
        tokenExpiryOverride:
          type: integer
          description: |
            Access-token lifetime in seconds for this client, 60 to 86400. Omit to keep the current
            value; `0` clears it, so the workspace's `tokenExpirySeconds` applies again.

    CreateApplicationRequest:
      type: object
      required: [clientId, name, redirectUris]
      properties:
        clientId:
          type: string
          pattern: "^[a-z0-9-]+$"
          description: Lowercase alphanumeric + hyphens only. Must be unique per workspace.
        name: { type: string }
        description: { type: string, nullable: true }
        accessType:
          type: string
          enum: [public, confidential]
          default: public
        redirectUris:
          type: array
          items: { type: string, format: uri }
          description: |
            Required only when `grantTypes` includes `authorization_code` (the default when
            `grantTypes` is omitted). A `client_credentials`-only application needs none.
        grantTypes:
          type: array
          items: { $ref: "#/components/schemas/GrantType" }
          description: |
            Defaults to `[authorization_code, refresh_token]` when omitted — never to
            `client_credentials`, even for a confidential application, since that would grant
            machine-to-machine capability by default. A confidential application that needs
            `client_credentials` must request it explicitly, or it will be refused
            (`unauthorized_client`) at the token endpoint.
        audience:
          type: string
          nullable: true
          description: |
            The default `aud` of this client's access tokens when no `resource` is requested.
            Defaults to the client id. ID tokens are always addressed to the client id.

    CreateApplicationResponse:
      type: object
      required: [application]
      properties:
        application: { $ref: "#/components/schemas/ApplicationDto" }
        clientSecret:
          type: string
          nullable: true
          description: Present only when `accessType == "confidential"`. Returned exactly once.

    ClientSecretResponse:
      type: object
      required: [clientSecret]
      properties:
        clientSecret:
          type: string
          description: Raw client secret. Returned exactly once — persist immediately.

    # ---- Sessions ----
    SessionDto:
      type: object
      required: [id, userId, scopes, createdAt, expiresAt]
      properties:
        id:        { type: integer }
        userId:    { type: integer }
        clientId:  { type: integer, nullable: true }
        scopes:    { type: string }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    # ---- Workspace ----
    WorkspaceDto:
      type: object
      required:
        [id, slug, displayName, tokenExpirySeconds, refreshTokenExpirySeconds,
         registrationEnabled, emailVerificationRequired, passkeysEnabled,
         signInMethods, passwordPolicy, mfaPolicy, lockoutMaxAttempts,
         lockoutDurationMinutes, magicLinkTtlMinutes, emailOtpSignupEnabled,
         emailOtpLockoutThreshold, corsAllowCredentials, portalLayout,
         loginIdentifierMode, emailDeliveryReady]
      properties:
        id: { type: integer }
        slug: { type: string }
        displayName: { type: string }
        issuerUrl: { type: string, nullable: true }
        publicBaseUrl:
          type: string
          nullable: true
          description: The workspace's own origin (e.g. `https://auth.example.com`). Null when it is served on the instance origin.
        tokenExpirySeconds: { type: integer, format: int64 }
        refreshTokenExpirySeconds: { type: integer, format: int64 }
        registrationEnabled: { type: boolean }
        emailVerificationRequired: { type: boolean }
        passkeysEnabled: { type: boolean }
        maxConcurrentSessions:
          type: integer
          nullable: true
          description: Active sessions a user may hold in one application. Null means no limit.
        signInMethods: { $ref: "#/components/schemas/WorkspaceSignInMethodsDto" }
        passwordPolicy: { $ref: "#/components/schemas/WorkspacePasswordPolicyDto" }
        mfaPolicy: { type: string, enum: [optional, required, required_admins] }
        lockoutMaxAttempts: { type: integer }
        lockoutDurationMinutes: { type: integer }
        magicLinkTtlMinutes: { type: integer }
        emailOtpSignupEnabled: { type: boolean }
        emailOtpLockoutThreshold: { type: integer }
        corsAllowCredentials: { type: boolean }
        portalLayout: { type: string, enum: [SIDEBAR, CENTERED] }
        loginIdentifierMode: { type: string, enum: [USERNAME, EMAIL, EITHER] }
        defaultLocale:
          type: string
          nullable: true
          description: Locale used when the browser asks for none the workspace has. Null means English.
        emailDeliveryReady:
          type: boolean
          description: |
            True when SMTP is switched on and has a host and a from address. The SMTP
            settings themselves are never returned.

    UpdateWorkspaceRequest:
      type: object
      additionalProperties: false
      description: |
        Every field is optional. An absent field keeps its current value; unknown fields are
        refused with 400. For `issuerUrl` and `defaultLocale` an empty string clears the value.
      properties:
        displayName: { type: string }
        issuerUrl: { type: string }
        publicBaseUrl:
          type: string
          description: |
            The origin users sign in on, scheme and host only (`https://auth.example.com`). The
            issuer, discovery document, sign-in and account pages, and emailed links move to it.
            Must be https (http only for localhost). An empty string clears it.
        tokenExpirySeconds: { type: integer, format: int64, minimum: 60 }
        refreshTokenExpirySeconds:
          type: integer
          format: int64
          description: Must be at least `tokenExpirySeconds`.
        registrationEnabled: { type: boolean }
        emailVerificationRequired: { type: boolean }
        signInMethods:
          type: object
          additionalProperties: false
          description: |
            At least one method must stay on. Turning password sign-in off, or turning on
            `magicLink` or `emailOtp`, requires SMTP to be ready; `smtp` in the same request
            counts, since it is applied first. Password sign-in cannot be turned off on `master`.
          properties:
            password: { type: boolean }
            passkey: { type: boolean }
            magicLink: { type: boolean }
            emailOtp: { type: boolean }
        passwordPolicy:
          type: object
          additionalProperties: false
          properties:
            minLength: { type: integer, minimum: 4, maximum: 128 }
            requireSpecial: { type: boolean }
            requireUppercase: { type: boolean }
            requireNumber: { type: boolean }
            historyCount: { type: integer, minimum: 0, maximum: 24 }
            maxAgeDays: { type: integer, minimum: 0, maximum: 365 }
            blacklistEnabled: { type: boolean }
            hibpCheckEnabled: { type: boolean }
        mfaPolicy: { type: string, enum: [optional, required, required_admins] }
        lockoutMaxAttempts:
          type: integer
          minimum: 0
          maximum: 100
          description: Failed password attempts before the account is locked. 0 turns lockout off.
        lockoutDurationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        magicLinkTtlMinutes: { type: integer, minimum: 1, maximum: 1440 }
        emailOtpSignupEnabled: { type: boolean }
        emailOtpLockoutThreshold: { type: integer, minimum: 0, maximum: 50 }
        corsAllowCredentials: { type: boolean }
        loginIdentifierMode: { type: string, enum: [USERNAME, EMAIL, EITHER] }
        defaultLocale:
          type: string
          description: One of the locales the server ships or has mounted, e.g. `es`.
        smtp: { $ref: "#/components/schemas/UpdateSmtpRequest" }
        maxConcurrentSessions:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Active sessions a user may hold in one application, e.g. one per device. A sign-in
            past the limit ends that user's oldest session in the same application; other
            applications are not counted. 0 removes the limit.

    UpdateSmtpRequest:
      type: object
      additionalProperties: false
      description: |
        Absent fields keep their current values. For `host`, `username` and `fromName` an
        empty string clears the value. With `enabled` true, `host` and a valid `fromAddress`
        are required.
      properties:
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        password:
          type: string
          writeOnly: true
          description: Never returned. Absent or blank keeps the stored password.
        fromAddress: { type: string, format: email }
        fromName: { type: string }
        tlsEnabled: { type: boolean }

    WorkspaceSignInMethodsDto:
      type: object
      required: [password, passkey, magicLink, emailOtp]
      properties:
        password: { type: boolean }
        passkey: { type: boolean }
        magicLink: { type: boolean }
        emailOtp: { type: boolean }

    WorkspacePasswordPolicyDto:
      type: object
      required:
        [minLength, requireSpecial, requireUppercase, requireNumber,
         historyCount, maxAgeDays, blacklistEnabled, hibpCheckEnabled]
      properties:
        minLength: { type: integer }
        requireSpecial: { type: boolean }
        requireUppercase: { type: boolean }
        requireNumber: { type: boolean }
        historyCount: { type: integer }
        maxAgeDays: { type: integer }
        blacklistEnabled: { type: boolean }
        hibpCheckEnabled: { type: boolean }

    # ---- Webhooks ----
    WebhookEndpointDto:
      type: object
      required: [id, url, description, events, enabled, createdAt]
      properties:
        id: { type: integer }
        url: { type: string, format: uri }
        description: { type: string }
        events:
          type: array
          items:
            type: string
            enum:
              [user.created, user.updated, user.deleted, login.success,
               login.failed, password.reset, mfa.enrolled, session.revoked]
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, default: "" }
        events:
          type: array
          items:
            type: string
            enum:
              [user.created, user.updated, user.deleted, login.success,
               login.failed, password.reset, mfa.enrolled, session.revoked]
          minItems: 1

    CreateWebhookResponse:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint: { $ref: "#/components/schemas/WebhookEndpointDto" }
        secret:
          type: string
          description: |
            Plaintext HMAC-SHA256 signing key. Returned exactly once; the
            server does not retain a plaintext copy.

    # ---- Resource Servers ----
    ResourceServerDto:
      type: object
      required: [id, identifier, name, enabled, scopes, createdAt]
      properties:
        id:          { type: integer }
        identifier:  { type: string, description: "RFC 8707 resource indicator (audience). Unique per workspace." }
        name:        { type: string }
        description: { type: string, nullable: true }
        enabled:     { type: boolean }
        scopes:      { type: array, items: { type: string } }
        createdAt:   { type: string, format: date-time }

    CreateResourceServerRequest:
      type: object
      required: [identifier, name]
      properties:
        identifier:
          type: string
          description: |
            RFC 8707 resource indicator. Either an absolute URI with a host,
            or an opaque string with no whitespace. Must be unique per
            workspace.
        name: { type: string }
        description: { type: string, nullable: true }
        scopes:
          type: array
          items: { type: string }
          default: []

    UpdateResourceServerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        scopes:
          type: array
          items: { type: string }
          default: []

    AllowedScopes:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          items: { type: string }

    SetAuthorizedResourceServersRequest:
      type: object
      required: [resourceServerIds]
      properties:
        resourceServerIds:
          type: array
          items: { type: integer }
          description: |
            Full replacement set of resource server IDs authorized for this
            client. Passing an empty array revokes all authorizations.

    # ---- API Keys ----
    ApiKeyDto:
      type: object
      required: [id, name, keyPrefix, scopes, enabled, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        keyPrefix:
          type: string
          description: First 16 chars of the raw key — safe to display in UI.
        scopes:
          type: array
          items: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        enabled: { type: boolean }
        bootstrapName:
          type: string
          nullable: true
          description: Set when the key was provisioned via KAUTH_BOOTSTRAP_API_KEYS.
        createdAt: { type: string, format: date-time }

    CreateApiKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, maxLength: 128 }
        scopes:
          type: array
          items: { type: string }
          minItems: 1
        expiresAt:
          type: string
          format: date-time
          nullable: true

    CreateApiKeyResponse:
      type: object
      required: [apiKey, rawKey]
      properties:
        apiKey: { $ref: "#/components/schemas/ApiKeyDto" }
        rawKey:
          type: string
          description: |
            Plaintext key value. Returned exactly once. Include this in
            future requests as `Authorization: Bearer <rawKey>`.

    # ---- Passkeys ----
    PasskeyDto:
      type: object
      required: [id, credentialId, name, transports, backupEligible, backupState, createdAt]
      properties:
        id: { type: integer, format: int64 }
        credentialId: { type: string }
        name: { type: string }
        aaguid:
          type: string
          nullable: true
          description: AAGUID of the authenticator, when reported by the client.
        transports:
          type: array
          items: { type: string }
        backupEligible: { type: boolean }
        backupState: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }

    # ---- Audit Logs ----
    AuditEventDto:
      type: object
      required: [eventType, createdAt]
      properties:
        eventType: { type: string }
        userId:    { type: integer, nullable: true }
        clientId:  { type: integer, nullable: true }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        details:
          type: object
          additionalProperties: { type: string }

    # ---- User attributes + claim mappers ----
    UserAttributesDto:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: object
          description: Flat key→value map. Empty object if the user has no attributes.
          additionalProperties: { type: string }

    UpsertUserAttributeRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          maxLength: 1024
          description: The attribute value. Always stored as a string — callers serialize their own types.

    ClaimMapperDto:
      type: object
      required: [attributeKey, claimName, includeInAccess, includeInId]
      properties:
        attributeKey:    { type: string, maxLength: 64 }
        claimName:       { type: string, maxLength: 128 }
        includeInAccess: { type: boolean }
        includeInId:     { type: boolean }

    ClaimMappersDto:
      type: object
      required: [mappers]
      properties:
        mappers:
          type: array
          items: { $ref: "#/components/schemas/ClaimMapperDto" }

    UpsertClaimMapperRequest:
      type: object
      required: [claimName]
      properties:
        claimName:
          type: string
          maxLength: 128
          description: |
            The JWT claim name. Cannot be a reserved OIDC claim name
            (`sub`, `iss`, `aud`, `exp`, `iat`, `email`, `tenant_id`, etc.).
            Use a prefix like `custom:department` to avoid collisions.
        includeInAccess: { type: boolean, default: true }
        includeInId:     { type: boolean, default: false }

    IdentityProviderDto:
      type: object
      description: |
        A configured identity provider. There is deliberately no `clientSecret` property:
        the secret is write-only and is never returned by any read.
      required:
        [key, kind, clientId, enabled, scopes, jitEnabled, jitAllowedDomains, createdAt, updatedAt]
      properties:
        key:
          type: string
          description: URL-safe provider key; it appears in the callback path and cannot change.
          pattern: "^[a-z0-9-]{1,32}$"
        kind:
          type: string
          enum: [oauth2, oidc]
        clientId: { type: string, maxLength: 255 }
        enabled:  { type: boolean }
        displayName: { type: string, nullable: true, maxLength: 64 }
        issuer:      { type: string, nullable: true, maxLength: 255 }
        authorizationEndpoint: { type: string, nullable: true, maxLength: 512 }
        tokenEndpoint:         { type: string, nullable: true, maxLength: 512 }
        jwksUri:               { type: string, nullable: true, maxLength: 512 }
        scopes:    { type: string, maxLength: 255 }
        jitEnabled:
          type: boolean
          description: |
            Whether a first sign-in through this provider may create a local account.
            Auto-creation additionally requires the provider to assert a verified email whose
            domain appears in `jitAllowedDomains`.
        jitAllowedDomains:
          type: array
          description: |
            Email domains a first sign-in may create an account for. Stored trimmed,
            lower-cased and de-duplicated. **An empty list is the feature switched off, never a
            wildcard** — no account is created automatically, even when `jitEnabled` is true.
          items: { type: string, maxLength: 253 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    IdentityProvidersDto:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/IdentityProviderDto" }

    UpsertIdentityProviderRequest:
      type: object
      required: [clientId]
      properties:
        clientId: { type: string, maxLength: 255 }
        clientSecret:
          type: string
          description: |
            Write-only. Required when creating; omit on update to keep the stored secret.
            Stored encrypted (AES-256-GCM) and never returned by any read.
        kind:
          type: string
          enum: [oauth2, oidc]
          description: |
            Defaults to what the key implies — `oauth2` for the built-in `google` and `github`
            keys, `oidc` for every other key. The two cannot be crossed.
        enabled: { type: boolean, default: true }
        displayName: { type: string, maxLength: 64 }
        issuer:
          type: string
          maxLength: 255
          description: Required for `oidc`. https only (http is accepted on loopback).
        authorizationEndpoint: { type: string, maxLength: 512 }
        tokenEndpoint:         { type: string, maxLength: 512 }
        jwksUri:               { type: string, maxLength: 512 }
        scopes:
          type: string
          maxLength: 255
          description: Space-separated. An `oidc` provider must request `openid`.
        jitEnabled:
          type: boolean
          description: |
            Whether a first sign-in through this provider may create a local account.
            **Omit to leave the stored value unchanged** — there is no default, because an
            update that says nothing about it must not switch it either way.
        jitAllowedDomains:
          type: array
          description: |
            Email domains a first sign-in may create an account for. Values are trimmed,
            lower-cased and de-duplicated server-side; each must be a bare domain (no `@`, no
            scheme, no path).

            **Omit to leave the stored list unchanged. Send `[]` to clear it** — an empty list
            is the feature switched off, and that is a different request from not mentioning it.
          items: { type: string, maxLength: 253 }

    SendOtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Applicant email address. Lowercased + trimmed server-side.
        originatingClientId:
          type: string
          description: |
            OAuth client_id that triggered the send. Required at verify-otp
            time to bind the authorization code to a registered client. The
            client must have at least one redirect URI configured.
        resources:
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
          description: |
            Optional RFC 8707 resource indicators to bind to the challenge and
            resulting authorization code. Each resource must be enabled in the
            workspace and authorized for originatingClientId.
        scope:
          type: string
          example: openid read:orders
          description: |
            Space-delimited scopes for the authorization code, as in the OAuth
            `scope` parameter. Defaults to `openid email profile`. When the code
            is issued, API scopes are narrowed as at the token endpoint: each must
            be declared by a requested resource and granted to
            originatingClientId on it, or verification answers `422` with
            `invalid_scope`. `openid`, `profile` and `email` always pass.

    SendOtpResponse:
      type: object
      required: [challengeId, expiresAt]
      properties:
        challengeId:
          type: string
          description: Opaque 64-char handle. Pass back unchanged to verify-otp.
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 expiry timestamp (10 minutes from issuance).

    VerifyOtpRequest:
      type: object
      required: [challengeId, otp]
      properties:
        challengeId:
          type: string
          description: The opaque handle returned from send-otp.
        otp:
          type: string
          minLength: 6
          maxLength: 6
          description: The 6-digit numeric code received in email.

    VerifyMfaRequest:
      type: object
      required: [mfaToken, code]
      properties:
        mfaToken:
          type: string
          description: The token from the `mfa_required` answer of verify-otp.
        code:
          type: string
          description: A 6-digit TOTP code, or one of the user's recovery codes.

    MfaRequiredProblem:
      type: object
      required: [type, title, status, detail, error, mfaToken, mfaRequirements, expiresAt]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, example: 403 }
        detail: { type: string }
        error:
          type: string
          enum: [mfa_required]
        mfaToken:
          type: string
          description: Opaque, signed. Pass unchanged to verify-mfa.
        mfaRequirements:
          type: array
          items:
            type: string
            enum: [otp, recovery-code]
        expiresAt:
          type: string
          format: date-time

    VerifyOtpResponse:
      type: object
      required: [authorizationCode, expiresAt, redirectUri]
      properties:
        authorizationCode:
          type: string
          description: |
            Single-use OAuth authorization code bound to the originating
            client. Exchange at `/protocol/openid-connect/token` using the
            standard `authorization_code` grant. TTL 60 seconds.
        expiresAt:
          type: string
          format: date-time
        redirectUri:
          type: string
          description: |
            The redirect URI the code was bound to (the first one registered
            on the originating client). The caller MUST echo this exact
            value at the `/token` exchange.

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Forbidden:
      description: Insufficient scope
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    ValidationError:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    TooManyRequests:
      description: Rate limit exceeded. Retry after the seconds indicated by the `Retry-After` header.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }

paths:
  # ==========================================================================
  # Users
  # ==========================================================================
  /users:
    get:
      operationId: listUsers
      summary: List users
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: subject
          schema: { type: string }
          description: |
            Exact match on the user's `sub`. Returns the one user with it, or an empty list;
            `search`, `limit` and `offset` are ignored.
        - in: query
          name: search
          schema: { type: string }
          description: Filter by username, email, or full name prefix
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Max number of results (1–200, default 50). Invalid values coerce to default.
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Zero-based offset for pagination. Invalid values coerce to 0.
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/UserDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createUser
      summary: Create a user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Username or email already in use
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/invite:
    post:
      operationId: inviteUser
      summary: Invite a new user via email
      tags: [Users]
      description: |
        Creates a user without a password and emails them a 72-hour invite
        link. The user sets their own password on first login. This is the
        canonical onboarding path for platforms integrating KotAuth as their
        auth provider — avoids provisioning passwords programmatically.

        Requires SMTP to be configured on the tenant. Returns **422** if SMTP
        is not ready.
      security: [{ bearerAuth: [users:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserRequest" }
      responses:
        "201":
          description: User created and invite email queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Username or email already in use
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }

    get:
      operationId: getUser
      summary: Get a user by ID
      tags: [Users]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: updateUser
      summary: Update a user's profile
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: disableUser
      summary: Disable a user account
      tags: [Users]
      description: Soft-disables the user. They cannot log in but their data is preserved.
      responses:
        "204": { description: User disabled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/send-reset-email:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }

    post:
      operationId: sendPasswordResetEmail
      summary: Admin-triggered password reset email
      tags: [Users]
      description: |
        Generates a password-reset token and emails it to the user via the
        tenant's configured SMTP. Idempotent — safe to call multiple times.
        Requires SMTP to be configured on the tenant. Completing the reset also
        verifies the user's email and settles a pending invite, so a user who
        resets instead of accepting their invite can sign in.
      security: [{ bearerAuth: [users:write] }]
      responses:
        "204": { description: Reset email queued }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{userId}/resend-invite:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }

    post:
      operationId: resendInvite
      summary: Resend a pending invite
      tags: [Users]
      description: |
        Emails a new invite link to a user who has not accepted their invite yet,
        and invalidates the previous link. Use it when an invite expired.
        Answers 422 when the user has no pending invite or the tenant's SMTP
        is not configured.
      security: [{ bearerAuth: [users:write] }]
      responses:
        "204": { description: Invite email queued }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{userId}/temporary-password:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }

    post:
      operationId: setTemporaryPassword
      summary: Generate a one-time temporary-password link
      tags: [Users]
      description: |
        Returns a one-time change-password URL that the user consumes to set
        a new password. Useful for email-less onboarding flows (ops team
        delivers the link over a trusted channel) or as a recovery tool when
        SMTP is misconfigured.

        The link is returned exactly once — the raw value is not persisted
        or logged on the server. Treat it as a secret. Expires in 24 hours.

        Stamps `CHANGE_PASSWORD` required action on the user — on next login
        their current credentials are accepted but they are routed to a
        forced-change-password page before tokens are issued.
      security: [{ bearerAuth: [users:write] }]
      responses:
        "201":
          description: Temporary-password link generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryPasswordResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/enable:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
    post:
      operationId: enableUser
      summary: Enable a disabled user
      description: |
        Re-enables a previously disabled user. Idempotent — no-op if the user
        is already enabled. Note that this does NOT clear an active account
        lockout (from failed-login threshold); use the admin console to clear
        the lockout separately.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: User enabled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/mfa/reset:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
    delete:
      operationId: resetUserMfa
      summary: Reset MFA for a user
      description: |
        Removes all TOTP enrollments and recovery codes. Helpdesk operation
        for users locked out of their authenticator. Idempotent — succeeds
        even if the user has no MFA enrolled.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: MFA reset }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{userId}/revoke-sessions:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
    post:
      operationId: revokeUserSessions
      summary: Revoke all active sessions for a user
      description: Used by security-incident response playbooks.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeSessionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{userId}/sessions:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
    get:
      operationId: listUserSessions
      summary: List active sessions for a user
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SessionDto" }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{userId}/roles/{roleId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
      - in: path
        name: roleId
        required: true
        schema: { type: integer }

    post:
      operationId: assignRoleToUser
      summary: Assign a role to a user
      tags: [Users]
      responses:
        "204": { description: Role assigned }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      operationId: unassignRoleFromUser
      summary: Remove a role from a user
      tags: [Users]
      responses:
        "204": { description: Role removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Roles
  # ==========================================================================
  /roles:
    get:
      operationId: listRoles
      summary: List roles
      tags: [Roles]
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RoleDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createRole
      summary: Create a role
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleRequest" }
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Role name already exists in this scope
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /roles/{roleId}:
    parameters:
      - in: path
        name: roleId
        required: true
        schema: { type: integer }

    get:
      operationId: getRole
      summary: Get a role by ID
      tags: [Roles]
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: updateRole
      summary: Update a role
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleRequest" }
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deleteRole
      summary: Delete a role
      tags: [Roles]
      responses:
        "204": { description: Role deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Groups
  # ==========================================================================
  /groups:
    get:
      operationId: listGroups
      summary: List groups
      tags: [Groups]
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/GroupDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createGroup
      summary: Create a group
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /groups/{groupId}:
    parameters:
      - in: path
        name: groupId
        required: true
        schema: { type: integer }

    get:
      operationId: getGroup
      summary: Get a group by ID
      tags: [Groups]
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: updateGroup
      summary: Update a group
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroupRequest" }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deleteGroup
      summary: Delete a group
      tags: [Groups]
      responses:
        "204": { description: Group deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/members/{userId}:
    parameters:
      - in: path
        name: groupId
        required: true
        schema: { type: integer }
      - in: path
        name: userId
        required: true
        schema: { type: integer }

    post:
      operationId: addGroupMember
      summary: Add a user to a group
      tags: [Groups]
      responses:
        "204": { description: Member added }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      operationId: removeGroupMember
      summary: Remove a user from a group
      tags: [Groups]
      responses:
        "204": { description: Member removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/roles/{roleRef}:
    parameters:
      - in: path
        name: groupId
        required: true
        schema: { type: integer }
      - in: path
        name: roleRef
        required: true
        schema: { type: string }
        description: Numeric role id or role name. Names must be unambiguous across scopes.
    post:
      operationId: assignRoleToGroup
      summary: Assign a role to a group
      description: |
        Every user who is (or later becomes) a member of the group inherits
        this role. Idempotent — assigning the same role twice succeeds
        silently.
      tags: [Groups]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Role assigned }
        "400":
          description: Missing roleRef path parameter
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Role name is ambiguous — use the numeric role id
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
    delete:
      operationId: unassignRoleFromGroup
      summary: Remove a role from a group
      description: |
        Members of the group lose this role assignment (their own directly-
        assigned roles are unaffected). Idempotent — removing a role that
        wasn't assigned succeeds silently.
      tags: [Groups]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Role removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Applications
  # ==========================================================================
  /applications:
    get:
      operationId: listApplications
      summary: List applications (OAuth clients)
      tags: [Applications]
      responses:
        "200":
          description: Application list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ApplicationDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createApplication
      summary: Create an OAuth2/OIDC client application
      tags: [Applications]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplicationRequest" }
            examples:
              confidentialApp:
                value:
                  clientId: internal-dashboard
                  name: Internal Dashboard
                  accessType: confidential
                  redirectUris:
                    - https://dashboard.example.com/callback
                  grantTypes: [authorization_code, refresh_token]
              m2mClient:
                summary: Machine-to-machine client (no redirect URI needed)
                value:
                  clientId: billing-worker
                  name: Billing Worker
                  accessType: confidential
                  redirectUris: []
                  grantTypes: [client_credentials]
      responses:
        "201":
          description: |
            Application created. If accessType is `confidential`, the response
            includes a freshly-minted `clientSecret` — persist it now, it
            cannot be retrieved later.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Client ID already in use in this workspace (including previously deleted apps)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{appId}:
    parameters:
      - in: path
        name: appId
        required: true
        schema: { type: integer }

    get:
      operationId: getApplication
      summary: Get an application by ID
      tags: [Applications]
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: updateApplication
      summary: Update an application
      tags: [Applications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApplicationRequest" }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deleteApplication
      summary: Soft-delete an application
      description: |
        Marks the application as deleted. The row is preserved so that
        historical audit logs and tokens issued to this client_id continue
        to resolve. The client_id is NOT reusable for a new application —
        creating a new app with the same client_id in this workspace
        returns 409 Conflict.
      tags: [Applications]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Application deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /applications/{appId}/regenerate-secret:
    parameters:
      - in: path
        name: appId
        required: true
        schema: { type: integer }
    post:
      operationId: regenerateApplicationSecret
      summary: Rotate the client_secret for a confidential application
      description: |
        Generates a new random secret, hashes it into storage, and returns
        the raw secret exactly once in the response body. Callers MUST
        persist the returned value — it is not retrievable afterwards.
        Also usable for public applications (harmless no-op — the secret
        is minted but unused; recommend not calling for public apps).
      tags: [Applications]
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Secret rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientSecretResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Sessions
  # ==========================================================================
  /sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      tags: [Sessions]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: user_id
          schema: { type: integer }
          description: Filter by user id
        - in: query
          name: application_id
          schema: { type: integer }
          description: Filter by client (application) id
        - in: query
          name: active_only
          schema: { type: boolean, default: true }
          description: |
            Only `true` is supported in v1.21.0. Passing `false` returns
            HTTP 400. Reserved for a future release when revoked-session
            history is exposed here (currently reconstructable via the
            audit-logs API).
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Active session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SessionDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "400":
          description: active_only=false is not supported in v1.21.0
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /sessions/{sessionId}:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema: { type: integer }

    delete:
      operationId: revokeSession
      summary: Revoke a session
      tags: [Sessions]
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Workspace
  # ==========================================================================
  /workspace:
    get:
      operationId: getWorkspace
      summary: Read the workspace configuration
      description: |
        Returns tenant metadata + which sign-in methods are enabled +
        security/password/MFA policy + magic-link/email-OTP limits. SMTP
        settings are never returned; `emailDeliveryReady` says whether email
        can be sent. Requires `workspace:read`.
      tags: [Workspace]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWorkspace
      summary: Change workspace settings
      description: |
        Partial update: only the fields in the body change. Runs the same validation and
        records the same audit events as the admin console. The whole request is applied
        in one transaction, so a refused field leaves every setting as it was. Requires
        `workspace:write`.
      tags: [Workspace]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkspaceRequest" }
            example:
              registrationEnabled: false
              mfaPolicy: required
              tokenExpirySeconds: 600
              defaultLocale: es
              smtp:
                enabled: true
                host: smtp.example.com
                fromAddress: no-reply@example.com
                password: "********"
              signInMethods: { password: false, emailOtp: true }
      responses:
        "200":
          description: The workspace after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceDto" }
        "400":
          description: The body is not valid JSON or names an unknown field
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ==========================================================================
  # Webhooks
  # ==========================================================================
  /webhooks:
    get:
      operationId: listWebhooks
      summary: List webhook endpoints
      tags: [Webhooks]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Webhook endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpointDto" }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createWebhook
      summary: Create a webhook endpoint
      description: |
        Returns the created endpoint plus a plaintext `secret` — this value
        is the HMAC-SHA256 signing key. It is returned exactly ONCE. Persist
        it now; the server has already hashed/stored its copy and cannot
        return it again.
      tags: [Webhooks]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookRequest" }
            examples:
              userLifecycle:
                value:
                  url: https://example.com/webhooks/kauth
                  description: Sync users to CRM
                  events:
                    - user.created
                    - user.deleted
      responses:
        "201":
          description: Endpoint created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateWebhookResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /webhooks/{endpointId}:
    parameters:
      - in: path
        name: endpointId
        required: true
        schema: { type: integer }
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      description: Idempotent — succeeds even if the endpoint does not exist.
      tags: [Webhooks]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Endpoint deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ==========================================================================
  # Resource Servers
  # ==========================================================================
  /resource-servers:
    get:
      operationId: listResourceServers
      summary: List resource servers
      description: |
        Resource servers (RFC 8707 resource indicators) represent APIs that
        access tokens can be scoped to via the `resource` parameter.
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Resource server list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ResourceServerDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createResourceServer
      summary: Create a resource server
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateResourceServerRequest" }
            examples:
              billingApi:
                value:
                  identifier: https://api.example.com/billing
                  name: Billing API
                  scopes:
                    - billing:read
                    - billing:write
      responses:
        "201":
          description: Resource server created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceServerDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A resource server with this identifier already exists
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /resource-servers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }

    get:
      operationId: getResourceServer
      summary: Get a resource server by ID
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Resource server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceServerDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: updateResourceServer
      summary: Update a resource server
      description: The identifier is immutable after creation — only name, description, and scopes may change.
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateResourceServerRequest" }
            examples:
              billingApi:
                value:
                  name: Billing API v2
                  description: Updated scopes for v2 rollout
                  scopes:
                    - billing:read
                    - billing:write
                    - billing:refund
      responses:
        "200":
          description: Updated resource server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceServerDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deleteResourceServer
      summary: Delete a resource server
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Resource server deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /applications/{appId}/authorized-resource-servers:
    parameters:
      - in: path
        name: appId
        required: true
        schema: { type: integer }

    get:
      operationId: listAuthorizedResourceServers
      summary: List resource servers authorized for a client
      description: |
        Returns the resource servers this application (OAuth client) is
        currently authorized to request tokens for via the `resource`
        parameter.
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Authorized resource server list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ResourceServerDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: setAuthorizedResourceServers
      summary: Replace the set of resource servers authorized for a client
      description: |
        Full replacement — any resource server IDs not included are
        de-authorized. All IDs must belong to the same workspace as the
        application, or the request fails with 422.
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAuthorizedResourceServersRequest" }
            examples:
              authorizeTwo:
                value:
                  resourceServerIds: [1, 2]
      responses:
        "204": { description: Authorization set updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{appId}/authorized-resource-servers/{rsId}/scopes:
    parameters:
      - in: path
        name: appId
        required: true
        schema: { type: integer }
      - in: path
        name: rsId
        required: true
        schema: { type: integer }

    get:
      operationId: getAllowedScopes
      summary: Scopes a client may request on one resource server
      description: |
        The per-client allowlist (ADR-23). A token request gets the
        intersection of what was requested, what the resource server
        declares and this list. Authorizing a client on a resource server
        starts this list with every scope the server declares.
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The allowed scopes, sorted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowedScopes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: setAllowedScopes
      summary: Replace the scopes a client may request on one resource server
      description: |
        Full replacement. The client must already be authorized on the
        resource server (404 otherwise), and every scope must be declared by
        it (422 otherwise). An empty list leaves the client authorized but
        able to request nothing on that server.
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowedScopes" }
            examples:
              narrow:
                value:
                  scopes: ["pos.catalog.read", "pos.sales.write"]
      responses:
        "204": { description: Allowed scopes replaced }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ==========================================================================
  # API Keys
  # ==========================================================================
  /api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys for the workspace
      description: |
        Never returns raw key material. Only prefix, scopes, metadata, and
        status. Use the prefix (first 16 chars) to identify keys in the UI.
      tags: [API Keys]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKeyDto" }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createApiKey
      summary: Create a new API key
      description: |
        Returns the raw key value exactly ONCE in the `rawKey` field. Persist
        it now; the server retains only a SHA-256 hash.

        **Meta-circular note:** a key with `api_keys:write` scope can create,
        revoke, or rotate other keys — including itself. Bootstrap keys
        (managed via `KAUTH_BOOTSTRAP_API_KEYS`) are read-only via this API
        and can only be modified through the environment.
      tags: [API Keys]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
            examples:
              ciDeployKey:
                value:
                  name: CI deploy key
                  scopes:
                    - users:read
                    - applications:read
                  expiresAt: "2027-01-01T00:00:00Z"
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateApiKeyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api-keys/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    delete:
      operationId: revokeApiKey
      summary: Revoke (soft-disable) an API key
      description: |
        Soft-revoke — sets `enabled = false` and preserves the row for audit.
        Hard-delete is not exposed via REST; use the admin CLI if a hard
        cleanup is required.

        Bootstrap keys (managed via `KAUTH_BOOTSTRAP_API_KEYS`) cannot be
        revoked through this endpoint and return 403.
      tags: [API Keys]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Key revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            Insufficient scope, or the key is bootstrap-provisioned and can
            only be revoked via KAUTH_BOOTSTRAP_API_KEYS
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Passkeys
  # ==========================================================================
  /users/{userId}/passkeys:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
    get:
      operationId: listUserPasskeys
      summary: List passkey credentials for a user
      tags: [Passkeys]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Passkeys for the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PasskeyDto" }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "400":
          description: Invalid user ID
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /passkeys/{credentialPk}:
    parameters:
      - in: path
        name: credentialPk
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: revokePasskey
      summary: Revoke a passkey credential
      description: |
        Deletes the passkey from the user's account and records an audit
        event. Returns 409 with `CannotRevokeLast` if this is the user's
        only remaining passkey and password login is disabled for the
        workspace.
      tags: [Passkeys]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Passkey revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Cannot revoke last passkey when password login disabled
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  # ==========================================================================
  # Audit Logs
  # ==========================================================================
  /audit-logs:
    get:
      operationId: listAuditLogs
      summary: List audit log events
      tags: [Audit Logs]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: query
          name: eventType
          schema:
            type: string
            description: Filter by AuditEventType enum value (e.g. LOGIN_SUCCESS, ADMIN_USER_CREATED)
        - in: query
          name: userId
          schema: { type: integer }
          description: Filter by user ID
      responses:
        "200":
          description: Audit event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditEventDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ==========================================================================
  # User Attributes
  # ==========================================================================
  /users/{userId}/attributes:
    get:
      summary: List all attributes for a user
      tags: [User Attributes]
      security: [{ bearerAuth: [user_attributes:read] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: User attributes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAttributesDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/attributes/{key}:
    put:
      summary: Create or update a user attribute
      description: |
        Upserts the attribute. Values are strings — callers serialize structured
        data themselves. Changes propagate to issued JWTs on the next token issuance.
      tags: [User Attributes]
      security: [{ bearerAuth: [user_attributes:write] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
        - in: path
          name: key
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertUserAttributeRequest" }
      responses:
        "204": { description: Attribute saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      summary: Delete a user attribute
      description: |
        Removes the attribute entirely. Different from setting it to an empty
        string — the claim will not be projected into tokens at all.
      tags: [User Attributes]
      security: [{ bearerAuth: [user_attributes:write] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
        - in: path
          name: key
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "204": { description: Attribute deleted (idempotent — 204 even if the key was missing) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Claim Mappers
  # ==========================================================================
  /claim-mappers:
    get:
      summary: List all claim mappers for the tenant
      tags: [Claim Mappers]
      security: [{ bearerAuth: [claim_mappers:read] }]
      responses:
        "200":
          description: Configured claim mappers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimMappersDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /claim-mappers/{attributeKey}:
    put:
      summary: Create or update a claim mapper
      description: |
        Upserts the mapping from `attributeKey` to `claimName`.

        - Reserved OIDC claim names (`sub`, `iss`, `aud`, etc.) return **400**.
        - Two attribute keys mapping to the same claim name in one tenant
          return **409 Conflict**.
        - A tenant may configure at most 20 claim mappers — further writes
          return **409**.
      tags: [Claim Mappers]
      security: [{ bearerAuth: [claim_mappers:write] }]
      parameters:
        - in: path
          name: attributeKey
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertClaimMapperRequest" }
      responses:
        "204": { description: Mapper saved }
        "400":
          description: Reserved claim name
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Duplicate claim name or mapper limit reached
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

    delete:
      summary: Delete a claim mapper
      description: |
        Deleting a mapper immediately stops the claim from appearing in tokens
        on the next issuance, even if user attributes for that key still exist.
      tags: [Claim Mappers]
      security: [{ bearerAuth: [claim_mappers:write] }]
      parameters:
        - in: path
          name: attributeKey
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "204": { description: Mapper deleted (idempotent) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ==========================================================================
  # Identity Providers
  # ==========================================================================
  /identity-providers:
    get:
      summary: List the workspace's identity providers
      description: |
        The client secret is never included in any response on this resource.
      tags: [Identity Providers]
      security: [{ bearerAuth: [identity_providers:read] }]
      responses:
        "200":
          description: Configured identity providers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProvidersDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /identity-providers/{providerKey}:
    get:
      summary: Retrieve one identity provider
      tags: [Identity Providers]
      security: [{ bearerAuth: [identity_providers:read] }]
      parameters:
        - in: path
          name: providerKey
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
      responses:
        "200":
          description: The provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProviderDto" }
        "400":
          description: Malformed provider key
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      summary: Create or update an identity provider
      description: |
        Creates the provider when `providerKey` is not yet configured (**201**), otherwise
        updates it (**200**). The provider key itself is immutable — accounts already linked
        to a provider point at it.

        Validation is shared with the admin UI: an `oidc` provider requires an `issuer` and
        the `openid` scope, every URL must be https (http on loopback only), the built-in
        `google`/`github` keys must stay `oauth2`, and every entry in `jitAllowedDomains` must
        be a bare domain.

        `jitEnabled` and `jitAllowedDomains` are omit-to-keep: a body that does not mention
        them leaves the stored values alone, so an unrelated update cannot silently change
        whether accounts are created automatically.
      tags: [Identity Providers]
      security: [{ bearerAuth: [identity_providers:write] }]
      parameters:
        - in: path
          name: providerKey
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertIdentityProviderRequest" }
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProviderDto" }
        "201":
          description: Provider created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityProviderDto" }
        "400":
          description: Malformed provider key
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      summary: Delete an identity provider
      tags: [Identity Providers]
      security: [{ bearerAuth: [identity_providers:write] }]
      parameters:
        - in: path
          name: providerKey
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]{1,32}$" }
      responses:
        "204": { description: Provider deleted }
        "400":
          description: Malformed provider key
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/send-otp:
    post:
      summary: Send an email OTP challenge
      description: |
        Generates a 6-digit code (10-minute TTL), persists its SHA-256 hash,
        and sends a branded email. Returns an opaque `challengeId` the caller
        forwards to `/auth/verify-otp`.

        Find-or-create semantics are gated by the tenant's
        `email_otp_signup_enabled` flag (default off). When off and the email
        doesn't already exist, the response shape is identical to the
        happy path — no enumeration leak. Response timing is padded
        toward a constant target to defend against latency-based enumeration.

        Per-email and per-IP rate limits apply (3/email/15min, 10/IP/15min by
        default).

        `originatingClientId` is required for the verify-otp authorization-code
        issuance to bind the resulting code to a confidential client. The
        client must have at least one redirect URI registered.

        Optional RFC 8707 `resources` are persisted with the challenge. On
        successful verification, every resource must be enabled and authorized
        for `originatingClientId`; the resulting authorization code carries the
        resource indicators into the token exchange.
      tags: [Auth — Email OTP]
      security: [{ bearerAuth: [auth:send-otp] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendOtpRequest" }
      responses:
        "202":
          description: Challenge issued (uniform — same shape for new and returning users)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendOtpResponse" }
        "400":
          description: Invalid email
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Tenant not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "429":
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /auth/verify-otp:
    post:
      summary: Verify an email OTP challenge
      description: |
        Validates the 6-digit code against the stored SHA-256 in constant
        time. On success, stamps `email_verified=true` on the user, grants
        any client-default roles configured for `originatingClientId`, and
        issues a single-use OAuth authorization code (60-second TTL) bound
        to the originating client. Exchange the code at the standard
        `/protocol/openid-connect/token` endpoint using the returned
        `redirectUri`.

        Per-challenge attempt cap is 5; over the cap the challenge is killed.
        N consecutive failed challenges (per-tenant
        `email_otp_lockout_threshold`, default 5) lock the user using the
        tenant's existing lockout window. The lock never leaks back —
        locked users always get `too_many_attempts`.

        **Second factor.** When the user has TOTP enrolled, no authorization
        code is issued here. The response is `403` with `error: mfa_required`,
        an `mfaToken` (valid 5 minutes) and `mfaRequirements`; send the token
        with a TOTP or recovery code to `/auth/verify-mfa` to get the code.
        When the workspace requires MFA and the user has not enrolled, the
        response is `403` with `mfa_enrollment_required`.
      tags: [Auth — Email OTP]
      security: [{ bearerAuth: [auth:verify-otp] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyOtpRequest" }
      responses:
        "200":
          description: Code verified; authorization code issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyOtpResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            The API key lacks the scope, or the user owes a second factor
            (`mfa_required`, body is `MfaRequiredProblem`) or must enroll one
            first (`mfa_enrollment_required`).
          content:
            application/problem+json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/MfaRequiredProblem" }
                  - { $ref: "#/components/schemas/ProblemDetail" }
        "404":
          description: Tenant not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "410":
          description: Challenge expired
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422":
          description: Invalid code, too many attempts, originating client misconfigured, or a requested scope the client may not receive (`invalid_scope`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "503":
          description: The server cannot issue MFA tokens, so a user who owes the second factor is refused
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /auth/verify-mfa:
    post:
      summary: Complete the second factor after an email OTP
      description: |
        Takes the `mfaToken` from a `403 mfa_required` answer of
        `/auth/verify-otp` and a TOTP code (6 digits) or a recovery code.
        On success, issues the same single-use authorization code
        `/auth/verify-otp` would have. The token is bound to the workspace
        and the user and expires 5 minutes after issue. Attempts share the
        user's TOTP lockout.
      tags: [Auth — Email OTP]
      security: [{ bearerAuth: [auth:verify-otp] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyMfaRequest" }
      responses:
        "200":
          description: Second factor verified; authorization code issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyOtpResponse" }
        "401":
          description: Missing API key, or the mfaToken is invalid, expired or for another workspace (`invalid_mfa_token`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410":
          description: The verified email challenge is too old to complete
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422":
          description: Wrong TOTP or recovery code (`invalid_mfa_code`), originating client misconfigured, or a requested scope the client may not receive (`invalid_scope`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "429":
          description: Too many attempts, or TOTP locked (`mfa_locked`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

tags:
  - name: Users
    description: User lifecycle management
  - name: Roles
    description: Role-based access control
  - name: Groups
    description: User group hierarchy
  - name: Applications
    description: OAuth 2.0 client applications
  - name: Sessions
    description: Active user sessions
  - name: Workspace
    description: Tenant metadata, sign-in methods, and security/MFA policy (read-only; SMTP excluded)
  - name: Webhooks
    description: Outbound event notification endpoints (signing secret is returned once, at creation)
  - name: Resource Servers
    description: RFC 8707 resource indicators (audiences) and their client authorization edges
  - name: API Keys
    description: Machine-to-machine credentials for the REST API itself (raw value returned once, at creation)
  - name: Passkeys
    description: WebAuthn/FIDO2 credential inspection and revocation for a user
  - name: Audit Logs
    description: Security event audit trail
  - name: User Attributes
    description: Per-user custom key/value metadata (projected into JWTs via claim mappers)
  - name: Claim Mappers
    description: Tenant-level configuration that projects user attributes into issued JWTs
  - name: Identity Providers
    description: Per-workspace social and OIDC providers (the client secret is write-only)
  - name: Auth — Email OTP
    description: |
      Email-OTP passwordless primitive — send a 6-digit code, verify it,
      and exchange the resulting authorization code at the standard
      `/token` endpoint. See ADR-15.
