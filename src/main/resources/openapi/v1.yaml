openapi: 3.1.0
info:
  title: KotAuth REST API
  version: 1.0.0
  description: |
    Machine-to-machine REST API for managing KotAuth identity platform resources.

    ## Authentication

    All endpoints require an API key passed as a Bearer token:
    ```
    Authorization: Bearer kauth_<tenantSlug>_<key>
    ```

    API keys are created and managed in the KotAuth Admin Console under
    **Settings → API Keys** for each workspace.

    ## Scopes

    Each API key is issued with a set of scopes that control which operations it
    may perform. Attempting a request without the required scope returns `403 Forbidden`.

    | Scope                | Description                                  |
    |----------------------|----------------------------------------------|
    | `users:read`         | List and retrieve users                      |
    | `users:write`        | Create, update, disable users; assign roles  |
    | `roles:read`         | List and retrieve roles                      |
    | `roles:write`        | Create, update, delete roles                 |
    | `groups:read`        | List and retrieve groups                     |
    | `groups:write`       | Create, update, delete groups; manage members|
    | `applications:read`  | List and retrieve applications               |
    | `applications:write` | Update and disable applications              |
    | `sessions:read`      | List active sessions                         |
    | `sessions:write`     | Revoke sessions                              |
    | `audit_logs:read`    | Read audit log events                        |
    | `user_attributes:read`  | Read custom per-user attributes           |
    | `user_attributes:write` | Create, update, delete per-user attributes |
    | `claim_mappers:read`    | List tenant claim mappers                 |
    | `claim_mappers:write`   | Create, update, delete claim mappers      |
    | `auth:send-otp`         | Trigger an email-OTP challenge for a user |
    | `auth:verify-otp`       | Verify an email-OTP challenge and obtain an authorization code |
    | `workspace:read`        | Read tenant metadata, sign-in methods, and security/MFA policy (no SMTP credentials) |
    | `webhooks:read`         | List webhook endpoints (never exposes the signing secret) |
    | `webhooks:write`        | Create and delete webhook endpoints       |
    | `resource_servers:read`  | List and retrieve resource servers (RFC 8707 resource indicators) |
    | `resource_servers:write` | Create, update, delete resource servers; manage client authorization edges |

    ## Custom attributes and JWT claims

    You can attach arbitrary key/value string attributes to users and project them
    into issued JWTs via tenant-level **claim mappers**. Changes take effect on the
    next access-token issuance (no live-session mutation).

    > **Security note:** attribute values flow unencrypted into JWTs, which are
    > base64-decodable by anyone in possession of the token. Do not store PII or
    > secrets as user attributes unless the token consumers are fully trusted.

    ## Errors

    All errors follow [RFC 7807 Problem Details](https://www.rfc-editor.org/rfc/rfc7807)
    with `Content-Type: application/problem+json`.

    ```json
    {
      "type": "https://kotauth.dev/errors/422",
      "title": "Validation Error",
      "status": 422,
      "detail": "Username may only contain letters, digits, dots, underscores, and hyphens."
    }
    ```

servers:
  - url: "{baseUrl}/t/{tenantSlug}/api/v1"
    description: KotAuth REST API v1
    variables:
      baseUrl:
        default: "http://localhost:8080"
      tenantSlug:
        default: "master"

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: KotAuth API Key (kauth_<slug>_<random>)

  schemas:
    # ---- Common ----
    ApiMeta:
      type: object
      properties:
        total:  { type: integer, description: "Total number of items in result set" }
        offset: { type: integer, description: "Current pagination offset" }
        limit:  { type: integer, description: "Current page size" }

    ProblemDetail:
      type: object
      properties:
        type:   { type: string, format: uri }
        title:  { type: string }
        status: { type: integer }
        detail: { type: string }

    # ---- Users ----
    UserDto:
      type: object
      required: [id, username, email, fullName, emailVerified, enabled, mfaEnabled, requiredActions, isLocked]
      properties:
        id:              { type: integer }
        username:        { type: string }
        email:           { type: string, format: email }
        fullName:        { type: string }
        emailVerified:   { type: boolean }
        enabled:         { type: boolean }
        mfaEnabled:      { type: boolean }
        requiredActions:
          type: array
          items:
            type: string
            enum: [SET_PASSWORD, CHANGE_PASSWORD]
          description: |
            Actions the user must complete on next login. Empty for fully
            provisioned accounts. `SET_PASSWORD` = user was invited and has
            not yet chosen a password. `CHANGE_PASSWORD` = admin issued a
            temporary password / forced reset.
        isLocked:
          type: boolean
          description: |
            True if the account currently has an active lockout (usually from
            failed-login threshold or OTP-brute-force protection). Task 2 will
            add `POST /users/{id}/enable` to clear it.
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: ISO-8601 timestamp of user creation. Nullable for legacy rows.

    CreateUserRequest:
      type: object
      required: [username, email, fullName, password]
      properties:
        username: { type: string, pattern: "^[a-zA-Z0-9._-]+$" }
        email:    { type: string, format: email }
        fullName: { type: string }
        password: { type: string, minLength: 4 }

    UpdateUserRequest:
      type: object
      required: [email, fullName]
      properties:
        email:    { type: string, format: email }
        fullName: { type: string }

    InviteUserRequest:
      type: object
      required: [username, email, fullName]
      description: |
        Invite a new user without a password. The user will receive an email
        with a 72-hour invite link and set their own password on first login.
        The tenant must have SMTP configured.
      properties:
        username: { type: string, maxLength: 128 }
        email:    { type: string, format: email }
        fullName: { type: string }

    TemporaryPasswordResponse:
      type: object
      required: [changePasswordUrl, expiresAt]
      description: |
        Response for POST /users/{userId}/temporary-password. The raw link is
        returned exactly once. Treat it as a secret and deliver to the user
        over a trusted channel. Expires 24 hours after issuance.
      properties:
        changePasswordUrl:
          type: string
          format: uri
          description: Full `/t/{slug}/change-password?token=…` URL
        expiresAt:
          type: string
          format: date-time

    RevokeSessionsResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          description: Number of active sessions that were revoked (0 if user had none).

    # ---- Roles ----
    RoleDto:
      type: object
      required: [id, name, scope, tenantId]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string, nullable: true }
        scope:       { type: string, enum: [TENANT, CLIENT] }
        tenantId:    { type: integer }

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string, pattern: "^[a-zA-Z0-9._-]+$" }
        description: { type: string }
        scope:       { type: string, enum: [tenant, client], default: tenant }

    UpdateRoleRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string, nullable: true }

    # ---- Groups ----
    GroupDto:
      type: object
      required: [id, name, tenantId]
      properties:
        id:            { type: integer }
        name:          { type: string }
        description:   { type: string, nullable: true }
        parentGroupId: { type: integer, nullable: true }
        tenantId:      { type: integer }

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:          { type: string }
        description:   { type: string }
        parentGroupId: { type: integer, nullable: true }

    UpdateGroupRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        description: { type: string, nullable: true }

    # ---- Applications ----
    ApplicationDto:
      type: object
      required: [id, clientId, name, accessType, enabled, redirectUris]
      properties:
        id:           { type: integer }
        clientId:     { type: string }
        name:         { type: string }
        description:  { type: string, nullable: true }
        accessType:   { type: string, enum: [public, confidential] }
        enabled:      { type: boolean }
        redirectUris: { type: array, items: { type: string, format: uri } }

    UpdateApplicationRequest:
      type: object
      required: [name, accessType, redirectUris]
      properties:
        name:         { type: string }
        description:  { type: string, nullable: true }
        accessType:   { type: string, enum: [public, confidential] }
        redirectUris: { type: array, items: { type: string, format: uri } }

    CreateApplicationRequest:
      type: object
      required: [clientId, name, redirectUris]
      properties:
        clientId:
          type: string
          pattern: "^[a-z0-9-]+$"
          description: Lowercase alphanumeric + hyphens only. Must be unique per workspace.
        name: { type: string }
        description: { type: string, nullable: true }
        accessType:
          type: string
          enum: [public, confidential]
          default: public
        redirectUris:
          type: array
          items: { type: string, format: uri }
          minItems: 1

    CreateApplicationResponse:
      type: object
      required: [application]
      properties:
        application: { $ref: "#/components/schemas/ApplicationDto" }
        clientSecret:
          type: string
          nullable: true
          description: Present only when `accessType == "confidential"`. Returned exactly once.

    ClientSecretResponse:
      type: object
      required: [clientSecret]
      properties:
        clientSecret:
          type: string
          description: Raw client secret. Returned exactly once — persist immediately.

    # ---- Sessions ----
    SessionDto:
      type: object
      required: [id, userId, scopes, createdAt, expiresAt]
      properties:
        id:        { type: integer }
        userId:    { type: integer }
        clientId:  { type: integer, nullable: true }
        scopes:    { type: string }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    # ---- Workspace ----
    WorkspaceDto:
      type: object
      required:
        [id, slug, displayName, tokenExpirySeconds, refreshTokenExpirySeconds,
         registrationEnabled, emailVerificationRequired, passkeysEnabled,
         signInMethods, passwordPolicy, mfaPolicy, lockoutMaxAttempts,
         lockoutDurationMinutes, magicLinkTtlMinutes, emailOtpSignupEnabled,
         emailOtpLockoutThreshold, corsAllowCredentials, portalLayout]
      properties:
        id: { type: integer }
        slug: { type: string }
        displayName: { type: string }
        issuerUrl: { type: string, nullable: true }
        tokenExpirySeconds: { type: integer, format: int64 }
        refreshTokenExpirySeconds: { type: integer, format: int64 }
        registrationEnabled: { type: boolean }
        emailVerificationRequired: { type: boolean }
        passkeysEnabled: { type: boolean }
        maxConcurrentSessions: { type: integer, nullable: true }
        signInMethods: { $ref: "#/components/schemas/WorkspaceSignInMethodsDto" }
        passwordPolicy: { $ref: "#/components/schemas/WorkspacePasswordPolicyDto" }
        mfaPolicy: { type: string, enum: [optional, required, required_admins] }
        lockoutMaxAttempts: { type: integer }
        lockoutDurationMinutes: { type: integer }
        magicLinkTtlMinutes: { type: integer }
        emailOtpSignupEnabled: { type: boolean }
        emailOtpLockoutThreshold: { type: integer }
        corsAllowCredentials: { type: boolean }
        portalLayout: { type: string, enum: [SIDEBAR, CENTERED] }

    WorkspaceSignInMethodsDto:
      type: object
      required: [password, passkey, magicLink, emailOtp]
      properties:
        password: { type: boolean }
        passkey: { type: boolean }
        magicLink: { type: boolean }
        emailOtp: { type: boolean }

    WorkspacePasswordPolicyDto:
      type: object
      required:
        [minLength, requireSpecial, requireUppercase, requireNumber,
         historyCount, maxAgeDays, blacklistEnabled, hibpCheckEnabled]
      properties:
        minLength: { type: integer }
        requireSpecial: { type: boolean }
        requireUppercase: { type: boolean }
        requireNumber: { type: boolean }
        historyCount: { type: integer }
        maxAgeDays: { type: integer }
        blacklistEnabled: { type: boolean }
        hibpCheckEnabled: { type: boolean }

    # ---- Webhooks ----
    WebhookEndpointDto:
      type: object
      required: [id, url, description, events, enabled, createdAt]
      properties:
        id: { type: integer }
        url: { type: string, format: uri }
        description: { type: string }
        events:
          type: array
          items:
            type: string
            enum:
              [user.created, user.updated, user.deleted, login.success,
               login.failed, password.reset, mfa.enrolled, session.revoked]
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        description: { type: string, default: "" }
        events:
          type: array
          items:
            type: string
            enum:
              [user.created, user.updated, user.deleted, login.success,
               login.failed, password.reset, mfa.enrolled, session.revoked]
          minItems: 1

    CreateWebhookResponse:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint: { $ref: "#/components/schemas/WebhookEndpointDto" }
        secret:
          type: string
          description: |
            Plaintext HMAC-SHA256 signing key. Returned exactly once; the
            server does not retain a plaintext copy.

    # ---- Resource Servers ----
    ResourceServerDto:
      type: object
      required: [id, identifier, name, enabled, scopes, createdAt]
      properties:
        id:          { type: integer }
        identifier:  { type: string, description: "RFC 8707 resource indicator (audience). Unique per workspace." }
        name:        { type: string }
        description: { type: string, nullable: true }
        enabled:     { type: boolean }
        scopes:      { type: array, items: { type: string } }
        createdAt:   { type: string, format: date-time }

    CreateResourceServerRequest:
      type: object
      required: [identifier, name]
      properties:
        identifier:
          type: string
          description: |
            RFC 8707 resource indicator. Either an absolute URI with a host,
            or an opaque string with no whitespace. Must be unique per
            workspace.
        name: { type: string }
        description: { type: string, nullable: true }
        scopes:
          type: array
          items: { type: string }
          default: []

    UpdateResourceServerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        scopes:
          type: array
          items: { type: string }
          default: []

    SetAuthorizedResourceServersRequest:
      type: object
      required: [resourceServerIds]
      properties:
        resourceServerIds:
          type: array
          items: { type: integer }
          description: |
            Full replacement set of resource server IDs authorized for this
            client. Passing an empty array revokes all authorizations.

    # ---- Audit Logs ----
    AuditEventDto:
      type: object
      required: [eventType, createdAt]
      properties:
        eventType: { type: string }
        userId:    { type: integer, nullable: true }
        clientId:  { type: integer, nullable: true }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        details:
          type: object
          additionalProperties: { type: string }

    # ---- User attributes + claim mappers ----
    UserAttributesDto:
      type: object
      required: [attributes]
      properties:
        attributes:
          type: object
          description: Flat key→value map. Empty object if the user has no attributes.
          additionalProperties: { type: string }

    UpsertUserAttributeRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          maxLength: 1024
          description: The attribute value. Always stored as a string — callers serialize their own types.

    ClaimMapperDto:
      type: object
      required: [attributeKey, claimName, includeInAccess, includeInId]
      properties:
        attributeKey:    { type: string, maxLength: 64 }
        claimName:       { type: string, maxLength: 128 }
        includeInAccess: { type: boolean }
        includeInId:     { type: boolean }

    ClaimMappersDto:
      type: object
      required: [mappers]
      properties:
        mappers:
          type: array
          items: { $ref: "#/components/schemas/ClaimMapperDto" }

    UpsertClaimMapperRequest:
      type: object
      required: [claimName]
      properties:
        claimName:
          type: string
          maxLength: 128
          description: |
            The JWT claim name. Cannot be a reserved OIDC claim name
            (`sub`, `iss`, `aud`, `exp`, `iat`, `email`, `tenant_id`, etc.).
            Use a prefix like `custom:department` to avoid collisions.
        includeInAccess: { type: boolean, default: true }
        includeInId:     { type: boolean, default: false }

    SendOtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Applicant email address. Lowercased + trimmed server-side.
        originatingClientId:
          type: string
          description: |
            OAuth client_id that triggered the send. Required at verify-otp
            time to bind the authorization code to a registered client. The
            client must have at least one redirect URI configured.
        resources:
          type: array
          uniqueItems: true
          default: []
          items:
            type: string
          description: |
            Optional RFC 8707 resource indicators to bind to the challenge and
            resulting authorization code. Each resource must be enabled in the
            workspace and authorized for originatingClientId.

    SendOtpResponse:
      type: object
      required: [challengeId, expiresAt]
      properties:
        challengeId:
          type: string
          description: Opaque 64-char handle. Pass back unchanged to verify-otp.
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 expiry timestamp (10 minutes from issuance).

    VerifyOtpRequest:
      type: object
      required: [challengeId, otp]
      properties:
        challengeId:
          type: string
          description: The opaque handle returned from send-otp.
        otp:
          type: string
          minLength: 6
          maxLength: 6
          description: The 6-digit numeric code received in email.

    VerifyOtpResponse:
      type: object
      required: [authorizationCode, expiresAt, redirectUri]
      properties:
        authorizationCode:
          type: string
          description: |
            Single-use OAuth authorization code bound to the originating
            client. Exchange at `/protocol/openid-connect/token` using the
            standard `authorization_code` grant. TTL 60 seconds.
        expiresAt:
          type: string
          format: date-time
        redirectUri:
          type: string
          description: |
            The redirect URI the code was bound to (the first one registered
            on the originating client). The caller MUST echo this exact
            value at the `/token` exchange.

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Forbidden:
      description: Insufficient scope
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    ValidationError:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }

paths:
  # ==========================================================================
  # Users
  # ==========================================================================
  /users:
    get:
      operationId: listUsers
      summary: List users
      tags: [Users]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Filter by username, email, or full name prefix
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: Max number of results (1–200, default 50). Invalid values coerce to default.
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Zero-based offset for pagination. Invalid values coerce to 0.
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/UserDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createUser
      summary: Create a user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Username or email already in use
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/invite:
    post:
      operationId: inviteUser
      summary: Invite a new user via email
      tags: [Users]
      description: |
        Creates a user without a password and emails them a 72-hour invite
        link. The user sets their own password on first login. This is the
        canonical onboarding path for platforms integrating KotAuth as their
        auth provider — avoids provisioning passwords programmatically.

        Requires SMTP to be configured on the tenant. Returns **422** if SMTP
        is not ready.
      security: [{ bearerAuth: [users:write] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteUserRequest" }
      responses:
        "201":
          description: User created and invite email queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Username or email already in use
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }

    get:
      operationId: getUser
      summary: Get a user by ID
      tags: [Users]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: updateUser
      summary: Update a user's profile
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: disableUser
      summary: Disable a user account
      tags: [Users]
      description: Soft-disables the user. They cannot log in but their data is preserved.
      responses:
        "204": { description: User disabled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/send-reset-email:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }

    post:
      operationId: sendPasswordResetEmail
      summary: Admin-triggered password reset email
      tags: [Users]
      description: |
        Generates a password-reset token and emails it to the user via the
        tenant's configured SMTP. Idempotent — safe to call multiple times.
        Requires SMTP to be configured on the tenant.
      security: [{ bearerAuth: [users:write] }]
      responses:
        "204": { description: Reset email queued }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{userId}/temporary-password:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }

    post:
      operationId: setTemporaryPassword
      summary: Generate a one-time temporary-password link
      tags: [Users]
      description: |
        Returns a one-time change-password URL that the user consumes to set
        a new password. Useful for email-less onboarding flows (ops team
        delivers the link over a trusted channel) or as a recovery tool when
        SMTP is misconfigured.

        The link is returned exactly once — the raw value is not persisted
        or logged on the server. Treat it as a secret. Expires in 24 hours.

        Stamps `CHANGE_PASSWORD` required action on the user — on next login
        their current credentials are accepted but they are routed to a
        forced-change-password page before tokens are issued.
      security: [{ bearerAuth: [users:write] }]
      responses:
        "201":
          description: Temporary-password link generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemporaryPasswordResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/enable:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
    post:
      operationId: enableUser
      summary: Enable a disabled user
      description: Idempotent. Also clears the account's active lockout if any.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: User enabled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/mfa/reset:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
    delete:
      operationId: resetUserMfa
      summary: Reset MFA for a user
      description: |
        Removes all TOTP enrollments and recovery codes. Helpdesk operation
        for users locked out of their authenticator. Idempotent — succeeds
        even if the user has no MFA enrolled.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: MFA reset }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{userId}/revoke-sessions:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
    post:
      operationId: revokeUserSessions
      summary: Revoke all active sessions for a user
      description: Used by security-incident response playbooks.
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeSessionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{userId}/sessions:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
    get:
      operationId: listUserSessions
      summary: List active sessions for a user
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SessionDto" }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{userId}/roles/{roleId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema: { type: integer }
      - in: path
        name: roleId
        required: true
        schema: { type: integer }

    post:
      operationId: assignRoleToUser
      summary: Assign a role to a user
      tags: [Users]
      responses:
        "204": { description: Role assigned }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      operationId: unassignRoleFromUser
      summary: Remove a role from a user
      tags: [Users]
      responses:
        "204": { description: Role removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Roles
  # ==========================================================================
  /roles:
    get:
      operationId: listRoles
      summary: List roles
      tags: [Roles]
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/RoleDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createRole
      summary: Create a role
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleRequest" }
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Role name already exists in this scope
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /roles/{roleId}:
    parameters:
      - in: path
        name: roleId
        required: true
        schema: { type: integer }

    get:
      operationId: getRole
      summary: Get a role by ID
      tags: [Roles]
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: updateRole
      summary: Update a role
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleRequest" }
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deleteRole
      summary: Delete a role
      tags: [Roles]
      responses:
        "204": { description: Role deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Groups
  # ==========================================================================
  /groups:
    get:
      operationId: listGroups
      summary: List groups
      tags: [Groups]
      responses:
        "200":
          description: Group list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/GroupDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createGroup
      summary: Create a group
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /groups/{groupId}:
    parameters:
      - in: path
        name: groupId
        required: true
        schema: { type: integer }

    get:
      operationId: getGroup
      summary: Get a group by ID
      tags: [Groups]
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: updateGroup
      summary: Update a group
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroupRequest" }
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deleteGroup
      summary: Delete a group
      tags: [Groups]
      responses:
        "204": { description: Group deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/members/{userId}:
    parameters:
      - in: path
        name: groupId
        required: true
        schema: { type: integer }
      - in: path
        name: userId
        required: true
        schema: { type: integer }

    post:
      operationId: addGroupMember
      summary: Add a user to a group
      tags: [Groups]
      responses:
        "204": { description: Member added }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    delete:
      operationId: removeGroupMember
      summary: Remove a user from a group
      tags: [Groups]
      responses:
        "204": { description: Member removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /groups/{groupId}/roles/{roleRef}:
    parameters:
      - in: path
        name: groupId
        required: true
        schema: { type: integer }
      - in: path
        name: roleRef
        required: true
        schema: { type: string }
        description: Numeric role id or role name. Names must be unambiguous across scopes.
    post:
      operationId: assignRoleToGroup
      summary: Assign a role to a group
      description: |
        Every user who is (or later becomes) a member of the group inherits
        this role. Idempotent — assigning the same role twice succeeds
        silently.
      tags: [Groups]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Role assigned }
        "400":
          description: Missing roleRef path parameter
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Group or role not found in this workspace
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422":
          description: Role name is ambiguous — use the numeric role id
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
    delete:
      operationId: unassignRoleFromGroup
      summary: Remove a role from a group
      description: |
        Members of the group lose this role assignment (their own directly-
        assigned roles are unaffected). Idempotent — removing a role that
        wasn't assigned succeeds silently.
      tags: [Groups]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Role removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Group not found in this workspace
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  # ==========================================================================
  # Applications
  # ==========================================================================
  /applications:
    get:
      operationId: listApplications
      summary: List applications (OAuth clients)
      tags: [Applications]
      responses:
        "200":
          description: Application list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ApplicationDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createApplication
      summary: Create an OAuth2/OIDC client application
      tags: [Applications]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplicationRequest" }
      responses:
        "201":
          description: |
            Application created. If accessType is `confidential`, the response
            includes a freshly-minted `clientSecret` — persist it now, it
            cannot be retrieved later.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateApplicationResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Client ID already in use in this workspace (including previously deleted apps)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /applications/{appId}:
    parameters:
      - in: path
        name: appId
        required: true
        schema: { type: integer }

    get:
      operationId: getApplication
      summary: Get an application by ID
      tags: [Applications]
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: updateApplication
      summary: Update an application
      tags: [Applications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApplicationRequest" }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deleteApplication
      summary: Soft-delete an application
      description: |
        Marks the application as deleted. The row is preserved so that
        historical audit logs and tokens issued to this client_id continue
        to resolve. The client_id is NOT reusable for a new application —
        creating a new app with the same client_id in this workspace
        returns 409 Conflict.
      tags: [Applications]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Application deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /applications/{appId}/regenerate-secret:
    parameters:
      - in: path
        name: appId
        required: true
        schema: { type: integer }
    post:
      operationId: regenerateApplicationSecret
      summary: Rotate the client_secret for a confidential application
      description: |
        Generates a new random secret, hashes it into storage, and returns
        the raw secret exactly once in the response body. Callers MUST
        persist the returned value — it is not retrievable afterwards.
        Also usable for public applications (harmless no-op — the secret
        is minted but unused; recommend not calling for public apps).
      tags: [Applications]
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Secret rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientSecretResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Sessions
  # ==========================================================================
  /sessions:
    get:
      operationId: listSessions
      summary: List active sessions
      tags: [Sessions]
      parameters:
        - in: query
          name: user_id
          schema: { type: integer }
          description: Filter by user id
        - in: query
          name: application_id
          schema: { type: integer }
          description: Filter by client (application) id
        - in: query
          name: active_only
          schema: { type: boolean, default: true }
          description: |
            Only `true` is supported in v1.21.0. Passing `false` returns
            HTTP 400. Reserved for a future release when revoked-session
            history is exposed here (currently reconstructable via the
            audit-logs API).
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Active session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SessionDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "400":
          description: active_only=false is not supported in v1.21.0
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /sessions/{sessionId}:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema: { type: integer }

    delete:
      operationId: revokeSession
      summary: Revoke a session
      tags: [Sessions]
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Workspace
  # ==========================================================================
  /workspace:
    get:
      operationId: getWorkspace
      summary: Read the workspace configuration
      description: |
        Returns tenant metadata + which sign-in methods are enabled +
        security/password/MFA policy + magic-link/email-OTP limits. SMTP
        credentials are NEVER returned — configure and inspect SMTP via
        the admin UI. Not editable via API in v1.21.0.
      tags: [Workspace]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Webhooks
  # ==========================================================================
  /webhooks:
    get:
      operationId: listWebhooks
      summary: List webhook endpoints
      tags: [Webhooks]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Webhook endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpointDto" }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createWebhook
      summary: Create a webhook endpoint
      description: |
        Returns the created endpoint plus a plaintext `secret` — this value
        is the HMAC-SHA256 signing key. It is returned exactly ONCE. Persist
        it now; the server has already hashed/stored its copy and cannot
        return it again.
      tags: [Webhooks]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookRequest" }
      responses:
        "201":
          description: Endpoint created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateWebhookResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Invalid URL, event name, or other validation failure
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /webhooks/{endpointId}:
    parameters:
      - in: path
        name: endpointId
        required: true
        schema: { type: integer }
    delete:
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      description: Idempotent — succeeds even if the endpoint does not exist.
      tags: [Webhooks]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Endpoint deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ==========================================================================
  # Resource Servers
  # ==========================================================================
  /resource-servers:
    get:
      operationId: listResourceServers
      summary: List resource servers
      description: |
        Resource servers (RFC 8707 resource indicators) represent APIs that
        access tokens can be scoped to via the `resource` parameter.
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Resource server list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ResourceServerDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createResourceServer
      summary: Create a resource server
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateResourceServerRequest" }
      responses:
        "201":
          description: Resource server created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceServerDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A resource server with this identifier already exists
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /resource-servers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }

    get:
      operationId: getResourceServer
      summary: Get a resource server by ID
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Resource server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceServerDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: updateResourceServer
      summary: Update a resource server
      description: The identifier is immutable after creation — only name, description, and scopes may change.
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateResourceServerRequest" }
      responses:
        "200":
          description: Updated resource server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceServerDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deleteResourceServer
      summary: Delete a resource server
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Resource server deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /applications/{appId}/authorized-resource-servers:
    parameters:
      - in: path
        name: appId
        required: true
        schema: { type: integer }

    get:
      operationId: listAuthorizedResourceServers
      summary: List resource servers authorized for a client
      description: |
        Returns the resource servers this application (OAuth client) is
        currently authorized to request tokens for via the `resource`
        parameter.
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Authorized resource server list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ResourceServerDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      operationId: setAuthorizedResourceServers
      summary: Replace the set of resource servers authorized for a client
      description: |
        Full replacement — any resource server IDs not included are
        de-authorized. All IDs must belong to the same workspace as the
        application, or the request fails with 422.
      tags: [Resource Servers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAuthorizedResourceServersRequest" }
      responses:
        "204": { description: Authorization set updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ==========================================================================
  # Audit Logs
  # ==========================================================================
  /audit-logs:
    get:
      operationId: listAuditLogs
      summary: List audit log events
      tags: [Audit Logs]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
        - in: query
          name: eventType
          schema:
            type: string
            description: Filter by AuditEventType enum value (e.g. LOGIN_SUCCESS, ADMIN_USER_CREATED)
        - in: query
          name: userId
          schema: { type: integer }
          description: Filter by user ID
      responses:
        "200":
          description: Audit event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AuditEventDto" } }
                  meta: { $ref: "#/components/schemas/ApiMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ==========================================================================
  # User Attributes
  # ==========================================================================
  /users/{userId}/attributes:
    get:
      summary: List all attributes for a user
      tags: [User Attributes]
      security: [{ bearerAuth: [user_attributes:read] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: User attributes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAttributesDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/attributes/{key}:
    put:
      summary: Create or update a user attribute
      description: |
        Upserts the attribute. Values are strings — callers serialize structured
        data themselves. Changes propagate to issued JWTs on the next token issuance.
      tags: [User Attributes]
      security: [{ bearerAuth: [user_attributes:write] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
        - in: path
          name: key
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertUserAttributeRequest" }
      responses:
        "204": { description: Attribute saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      summary: Delete a user attribute
      description: |
        Removes the attribute entirely. Different from setting it to an empty
        string — the claim will not be projected into tokens at all.
      tags: [User Attributes]
      security: [{ bearerAuth: [user_attributes:write] }]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
        - in: path
          name: key
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "204": { description: Attribute deleted (idempotent — 204 even if the key was missing) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==========================================================================
  # Claim Mappers
  # ==========================================================================
  /claim-mappers:
    get:
      summary: List all claim mappers for the tenant
      tags: [Claim Mappers]
      security: [{ bearerAuth: [claim_mappers:read] }]
      responses:
        "200":
          description: Configured claim mappers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimMappersDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /claim-mappers/{attributeKey}:
    put:
      summary: Create or update a claim mapper
      description: |
        Upserts the mapping from `attributeKey` to `claimName`.

        - Reserved OIDC claim names (`sub`, `iss`, `aud`, etc.) return **400**.
        - Two attribute keys mapping to the same claim name in one tenant
          return **409 Conflict**.
        - A tenant may configure at most 20 claim mappers — further writes
          return **409**.
      tags: [Claim Mappers]
      security: [{ bearerAuth: [claim_mappers:write] }]
      parameters:
        - in: path
          name: attributeKey
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertClaimMapperRequest" }
      responses:
        "204": { description: Mapper saved }
        "400":
          description: Reserved claim name
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Duplicate claim name or mapper limit reached
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

    delete:
      summary: Delete a claim mapper
      description: |
        Deleting a mapper immediately stops the claim from appearing in tokens
        on the next issuance, even if user attributes for that key still exist.
      tags: [Claim Mappers]
      security: [{ bearerAuth: [claim_mappers:write] }]
      parameters:
        - in: path
          name: attributeKey
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "204": { description: Mapper deleted (idempotent) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/send-otp:
    post:
      summary: Send an email OTP challenge
      description: |
        Generates a 6-digit code (10-minute TTL), persists its SHA-256 hash,
        and sends a branded email. Returns an opaque `challengeId` the caller
        forwards to `/auth/verify-otp`.

        Find-or-create semantics are gated by the tenant's
        `email_otp_signup_enabled` flag (default off). When off and the email
        doesn't already exist, the response shape is identical to the
        happy path — no enumeration leak. Response timing is padded
        toward a constant target to defend against latency-based enumeration.

        Per-email and per-IP rate limits apply (3/email/15min, 10/IP/15min by
        default).

        `originatingClientId` is required for the verify-otp authorization-code
        issuance to bind the resulting code to a confidential client. The
        client must have at least one redirect URI registered.

        Optional RFC 8707 `resources` are persisted with the challenge. On
        successful verification, every resource must be enabled and authorized
        for `originatingClientId`; the resulting authorization code carries the
        resource indicators into the token exchange.
      tags: [Auth — Email OTP]
      security: [{ bearerAuth: [auth:send-otp] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendOtpRequest" }
      responses:
        "202":
          description: Challenge issued (uniform — same shape for new and returning users)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendOtpResponse" }
        "400":
          description: Invalid email
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Tenant not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "429":
          description: Rate limit exceeded
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

  /auth/verify-otp:
    post:
      summary: Verify an email OTP challenge
      description: |
        Validates the 6-digit code against the stored SHA-256 in constant
        time. On success, stamps `email_verified=true` on the user, grants
        any client-default roles configured for `originatingClientId`, and
        issues a single-use OAuth authorization code (60-second TTL) bound
        to the originating client. Exchange the code at the standard
        `/protocol/openid-connect/token` endpoint using the returned
        `redirectUri`.

        Per-challenge attempt cap is 5; over the cap the challenge is killed.
        N consecutive failed challenges (per-tenant
        `email_otp_lockout_threshold`, default 5) lock the user using the
        tenant's existing lockout window. The lock never leaks back —
        locked users always get `too_many_attempts`.
      tags: [Auth — Email OTP]
      security: [{ bearerAuth: [auth:verify-otp] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyOtpRequest" }
      responses:
        "200":
          description: Code verified; authorization code issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyOtpResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Tenant not found
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "410":
          description: Challenge expired
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "422":
          description: Invalid code, too many attempts, or originating client misconfigured
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

tags:
  - name: Users
    description: User lifecycle management
  - name: Roles
    description: Role-based access control
  - name: Groups
    description: User group hierarchy
  - name: Applications
    description: OAuth 2.0 client applications
  - name: Sessions
    description: Active user sessions
  - name: Workspace
    description: Tenant metadata, sign-in methods, and security/MFA policy (read-only; SMTP excluded)
  - name: Webhooks
    description: Outbound event notification endpoints (signing secret is returned once, at creation)
  - name: Resource Servers
    description: RFC 8707 resource indicators (audiences) and their client authorization edges
  - name: Audit Logs
    description: Security event audit trail
  - name: User Attributes
    description: Per-user custom key/value metadata (projected into JWTs via claim mappers)
  - name: Claim Mappers
    description: Tenant-level configuration that projects user attributes into issued JWTs
  - name: Auth — Email OTP
    description: |
      Email-OTP passwordless primitive — send a 6-digit code, verify it,
      and exchange the resulting authorization code at the standard
      `/token` endpoint. See ADR-15.
