# ─── Kotauth — production stack with Caddy (automatic TLS) ───────────────────
# Extends docker-compose.yml with a Caddy reverse proxy that handles
# automatic TLS certificate provisioning via Let's Encrypt.
#
# Prerequisites:
#   - A domain pointing to this server (e.g. auth.yourdomain.com)
#   - Ports 80 and 443 open on the host firewall
#   - A filled-in .env with KAUTH_ENV=production, KAUTH_BASE_URL=https://...
#
# Usage (run from repo root or your kotauth/ directory):
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# Required .env additions for production:
#   KAUTH_BASE_URL=https://auth.yourdomain.com
#   KAUTH_ENV=production
#   KAUTH_SECRET_KEY=<openssl rand -hex 32>
#   DOMAIN=auth.yourdomain.com          # used by Caddy below
#   ACME_EMAIL=you@yourdomain.com       # Let's Encrypt notifications
# ─────────────────────────────────────────────────────────────────────────────

name: kotauth

services:
  caddy:
    image: caddy:2-alpine
    container_name: kotauth-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required — set it in .env (e.g. auth.yourdomain.com)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required — used for Let's Encrypt notifications}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # The app service inherits port 8080 from docker-compose.yml.
  # Block it at the firewall level so only Caddy handles public traffic.
  # Example (ufw): ufw deny 8080
  app:
    environment:
      # Caddy overwrites X-Forwarded-For with the real client IP, so it is
      # safe to honor forwarded headers here. Never set this without a
      # reverse proxy in front — it lets clients spoof rate-limit IPs.
      KAUTH_TRUSTED_PROXY: "true"

volumes:
  caddy_data:
  caddy_config:

# ── Docker Secrets example ───────────────────────────────────────────────────
# Uncomment the blocks below to source KAUTH_SECRET_KEY and DB_PASSWORD from
# Docker / Swarm secrets instead of .env. The app reads `*_FILE` env vars and
# loads the secret value from the referenced path. See docs/ENV_REFERENCE.md
# for the full list of supported variables.
#
# Create the secrets first:
#   printf %s "$(openssl rand -hex 32)" | docker secret create kauth_secret_key -
#   printf %s "your-db-password"        | docker secret create db_password       -
#
# secrets:
#   kauth_secret_key:
#     external: true
#   db_password:
#     external: true
#
# services:
#   app:
#     secrets:
#       - kauth_secret_key
#       - db_password
#     environment:
#       KAUTH_SECRET_KEY_FILE: /run/secrets/kauth_secret_key
#       DB_PASSWORD_FILE:      /run/secrets/db_password
#     # Remove KAUTH_SECRET_KEY / DB_PASSWORD from .env when using this.
